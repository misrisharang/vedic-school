    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #FBF9F5;
        color: #1c1917;
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        justify-content: center;
        padding: 2rem 1.5rem;
      }
      .container {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        background-color: #F8EFEA;
        color: #C85A32;
        border: 1px solid #E6C5B9;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      .badge svg {
        width: 0.875rem;
        height: 0.875rem;
      }
      h1 {
        font-family: 'Lora', Georgia, serif;
        font-size: 2.5rem;
        line-height: 1.15;
        font-weight: 700;
        color: #1c1917;

        margin-bottom: 0.75rem;
      }
      @media (min-width: 640px) {
        h1 {

        }
      }
      p {

        line-height: 1.6;
        color: #57534e;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: #C85A32;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        transition: background-color 0.2s, transform 0.15s;
      }
      .btn:hover {
        background-color: #b04e2a;
        transform: translateY(-1px);
      }
      .btn svg {
        width: 1rem;
        height: 1rem;
        transition: transform 0.2s;
      }
      .btn:hover svg {
        transform: translateX(2px);
      }
      .links {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(231, 229, 228, 0.8);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 1rem;
        font-size: 0.8125rem;
        color: #78716c;
      }
      .links a {
        color: #78716c;
        text-decoration: none;
        transition: color 0.15s;
      }
      .links a:hover {
        color: #C85A32;
      }
      .links span {
        color: #d6d3d1;
      }
