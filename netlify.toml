[build]
  base = "artifacts/vedic-school"
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  PORT = "5173"
  BASE_PATH = "/"

[[edge_functions]]
  function = "blog-slug-validator"
  path = "/blog/*"

# Canonical redirect: apex domain to www primary domain
[[redirects]]
  from = "https://thevedicschool.com/*"
  to = "https://www.thevedicschool.com/:splat"
  status = 301
  force = true

# Client-side SPA rewrites for private admin routes (HTTP 200)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Sitemap aliases: ensure /sitemap and /sitemap_index.xml redirect to /sitemap.xml
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301

# Catch-all fallback for unknown routes (Genuine HTTP 404)
# Note: Static prerendered files (e.g. /, /about, /vedic-maths, etc.) are served directly
# by Netlify CDN at HTTP 200 without needing redirect rules.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Explicit MIME type & caching headers for discovery assets
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llm.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

